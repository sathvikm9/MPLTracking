name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - MPLTracking
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BMS_HEADLESS: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Collect live snapshot
        if: github.event_name != 'push'
        run: npm run collect:today

      - name: Reject empty snapshot
        if: github.event_name != 'push'
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs/promises';
          const data = JSON.parse(await fs.readFile('./public/data/latest.json', 'utf8'));
          const totalShows = Number(data?.summary?.totalShows || 0);
          if (totalShows <= 0) {
            throw new Error('Collector returned 0 shows; refusing to publish an empty snapshot.');
          }
          console.log(`Snapshot looks valid: ${totalShows} shows`);
          EOF

      - name: Build site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
